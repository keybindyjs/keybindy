name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Resolve pnpm version
        id: pnpm-version
        shell: bash
        run: echo "version=$(jq --raw-output '.packageManager | split("@")[1] | split("+")[0]' package.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports OIDC trusted publishing
        shell: bash
        run: |
          npm install -g npm@11.18.0
          node -v
          npm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests & Build
        run: |
          pnpm test
          pnpm build

      - name: Publish to NPM
        run: pnpm --filter "./packages/**" publish --access public --provenance --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
